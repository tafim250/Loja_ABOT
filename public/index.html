<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Test-only business automation demo for customer conversations and orders." />
    <title>LojaBot — Demo Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="./lojabot-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="./" aria-label="LojaBot, dashboard home">
          <span class="brand-mark"><span></span><span></span><span></span></span>
          <span class="brand-copy"><strong>loja<span>bot</span></strong><small>BUSINESS AUTOMATION</small></span>
        </a>
        <div class="store-switcher">
          <span class="store-avatar">RS</span>
          <span class="store-meta"><strong>Root Store</strong><small>Demo store</small></span>
          <span class="chevron">⌄</span>
        </div>
        <div class="nav-caption">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-link is-active" data-page="overview"><span class="nav-icon">▦</span><span>Overview</span></button>
          <button class="nav-link" data-page="conversations"><span class="nav-icon">▤</span><span>Conversations</span><span class="nav-count" id="conversation-count">1</span></button>
          <button class="nav-link" data-page="products"><span class="nav-icon">◇</span><span>Catalog</span></button>
          <button class="nav-link" data-page="orders"><span class="nav-icon">▣</span><span>Orders</span></button>
          <button class="nav-link" data-page="customers"><span class="nav-icon">♙</span><span>Customers</span></button>
        </nav>
        <div class="nav-caption nav-caption-lower">SYSTEM</div>
        <nav class="main-nav" aria-label="Settings">
          <button class="nav-link" data-page="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-foot">
          <div class="side-agent"><span class="agent-dot"></span><span><strong>Demo agent</strong><small>Local rules · test mode</small></span></div>
          <button class="profile-button" data-action="profile"><span class="profile-avatar">O</span><span><strong>Owner</strong><small>Test environment</small></span><span class="more-dots">···</span></button>
        </div>
      </aside>

      <div class="work-area">
        <header class="topbar">
          <div class="topbar-context"><span class="topbar-kicker">ROOT STORE <span class="topbar-divider">/</span> <span id="crumb-label">OVERVIEW</span></span><strong id="topbar-title">Overview</strong></div>
          <div class="topbar-actions">
            <span class="environment-pill"><span class="pulse-dot"></span> TEST ENVIRONMENT</span>
            <button class="icon-button" title="Demo help" aria-label="Help" data-action="help">?</button>
            <button class="reset-button" data-action="reset"><span>↺</span> Reset demo</button>
          </div>
        </header>

        <main class="workspace">
          <section class="page-view" id="page-view" aria-live="polite"></section>
          <aside class="chat-panel" id="chat-panel" aria-label="Conversation simulator"></aside>
        </main>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
